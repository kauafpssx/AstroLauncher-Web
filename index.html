<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroLauncher | Launcher de Minecraft leve e open source</title>
    <meta
      name="description"
      content="Launcher de Minecraft leve, moderno e de código aberto, feito com Rust e React. Todas as versões, loaders, mods, modpacks, Mapa da Seed e muito mais."
    />
    <meta name="theme-color" content="#0d0d0d" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Prévia ao compartilhar o link (Discord, WhatsApp, X...) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="AstroLauncher" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta
      property="og:title"
      content="AstroLauncher | Launcher de Minecraft leve e open source"
    />
    <meta
      property="og:description"
      content="Todas as versões, loaders, mods e modpacks em um só lugar. Feito com Rust e React."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo do AstroLauncher com o texto: launcher de Minecraft leve, moderno e de código aberto"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AstroLauncher",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Windows, macOS, Linux",
        "description": "Launcher de Minecraft leve, moderno e de código aberto, feito com Rust e React.",
        "url": "%VITE_SITE_URL%/",
        "downloadUrl": "https://github.com/kauafpssx/AstroLauncher/releases/latest",
        "license": "https://www.gnu.org/licenses/gpl-3.0.html",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" },
        "author": {
          "@type": "Person",
          "name": "kauafpssx",
          "url": "https://github.com/kauafpssx"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
